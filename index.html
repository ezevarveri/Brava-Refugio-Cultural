<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Brava · Gestión</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0B1220; --panel:#121C31; --card:#18243F; --card2:#1E2C4B; --line:#2A3858;
  --brava:#E8582B; --brava2:#FF7A4D; --txt:#F4F1EA; --mut:#9AA6BF;
  --ok:#5BC27A; --bad:#FF6B5E; --warn:#F2B134; --info:#7FA6FF; --violet:#A9B8D8;
  --r:18px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{font-size:17px}
body{background:var(--bg);color:var(--txt);font-family:'DM Sans',system-ui,sans-serif;min-height:100vh;
  background-image:radial-gradient(1200px 500px at 85% -10%,rgba(232,88,43,.10),transparent 60%)}
h1,h2,h3,.bebas{font-family:'Bebas Neue',sans-serif;font-weight:400;letter-spacing:.04em}
button,input,select,textarea{font:inherit;color:inherit}

/* layout */
.app{display:grid;grid-template-columns:250px 1fr;min-height:100vh}
.side{background:var(--panel);border-right:1px solid var(--line);padding:1.4rem 1rem;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:.35rem}
.logo{display:flex;align-items:center;gap:.8rem;padding:.2rem .5rem 1.2rem}
.logo i{width:48px;height:48px;border-radius:50%;background:var(--brava);display:grid;place-items:center;font:normal 700 .62rem/1.1 'DM Sans';text-align:center;letter-spacing:.02em}
.logo b{font-family:'Bebas Neue';font-size:1.9rem;font-weight:400;letter-spacing:.06em;line-height:1}
.logo small{display:block;color:var(--mut);font-size:.68rem;letter-spacing:.18em;text-transform:uppercase;margin-top:2px}
.nav{display:flex;align-items:center;gap:.9rem;padding:.9rem 1rem;border-radius:14px;cursor:pointer;color:var(--mut);font-weight:600;font-size:1.02rem;border:0;background:none;text-align:left;width:100%}
.nav .ic{font-size:1.4rem;width:1.8rem;text-align:center}
.nav:hover{background:var(--card);color:var(--txt)}
.nav.on{background:var(--brava);color:#fff}
.main{padding:2rem 2.4rem 3rem;max-width:1200px;width:100%}
.bottom{display:none}

/* typography */
.h1{font-family:'Bebas Neue';font-size:2.6rem;letter-spacing:.05em;line-height:1}
.h1 em{color:var(--brava);font-style:normal}
.sub{color:var(--mut);margin-top:.3rem}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;margin-bottom:1.6rem;flex-wrap:wrap}
.sec{font-family:'Bebas Neue';font-size:1.35rem;letter-spacing:.08em;color:var(--brava2);margin:1.8rem 0 .8rem;display:flex;align-items:center;gap:.7rem}
.sec small{font-family:'DM Sans';font-size:.8rem;color:var(--mut);letter-spacing:0}

/* components */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:1.2rem}
.grid{display:grid;gap:1rem}
.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.acts{display:grid;grid-template-columns:repeat(4,1fr);gap:1rem;margin-bottom:1.4rem}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:1.1rem 1.2rem}
.stat .l{color:var(--mut);font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;font-weight:600}
.stat .v{font-family:'Bebas Neue';font-size:2.3rem;letter-spacing:.03em;line-height:1.15;margin-top:.2rem}
.ok{color:var(--ok)}.bad{color:var(--bad)}.warn{color:var(--warn)}.mut{color:var(--mut)}.brava{color:var(--brava2)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;min-height:50px;padding:.7rem 1.3rem;border-radius:14px;border:1px solid var(--line);background:var(--card2);cursor:pointer;font-weight:700;font-size:1rem;transition:.12s}
.btn:hover{border-color:var(--mut)}
.btn:active{transform:scale(.97)}
.btn.p{background:var(--brava);border-color:var(--brava);color:#fff}
.btn.p:hover{background:var(--brava2)}
.btn.g{background:transparent}
.btn.d{background:rgba(255,107,94,.12);border-color:rgba(255,107,94,.4);color:var(--bad)}
.btn.ok2{background:rgba(91,194,122,.14);border-color:rgba(91,194,122,.5);color:var(--ok)}
.btn.s{min-height:40px;padding:.4rem .9rem;font-size:.9rem;border-radius:11px}
.btn.big{min-height:64px;font-size:1.1rem;flex-direction:column;gap:.2rem}
.chip{display:inline-block;padding:.2rem .65rem;border-radius:20px;font-size:.76rem;font-weight:700;background:var(--line);color:var(--mut)}
.chip.ok{background:rgba(91,194,122,.16);color:var(--ok)}.chip.bad{background:rgba(255,107,94,.16);color:var(--bad)}
.chip.warn{background:rgba(242,177,52,.16);color:var(--warn)}.chip.br{background:rgba(232,88,43,.2);color:var(--brava2)}
.chip.in{background:rgba(127,166,255,.16);color:var(--info)}.chip.vi{background:rgba(169,184,216,.16);color:var(--violet)}
.row{display:flex;align-items:center;gap:.8rem;flex-wrap:wrap}
.sp{flex:1}
.list>*{border-bottom:1px solid var(--line)}.list>*:last-child{border-bottom:0}
.item{display:flex;align-items:center;gap:1rem;padding:.9rem .2rem;flex-wrap:wrap}
.item .t{font-weight:700}.item .d{color:var(--mut);font-size:.88rem}
.time{font-family:'Bebas Neue';font-size:1.35rem;letter-spacing:.04em;min-width:96px;color:var(--brava2)}
.empty{color:var(--mut);text-align:center;padding:1.6rem 1rem}
.tabs{display:flex;gap:.4rem;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:.35rem;margin-bottom:1.3rem;flex-wrap:wrap;width:fit-content;max-width:100%}
.tab{padding:.65rem 1.2rem;border-radius:12px;cursor:pointer;font-weight:700;color:var(--mut);border:0;background:none;font-size:.98rem}
.tab.on{background:var(--brava);color:#fff}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;color:var(--mut);padding:.7rem .8rem;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:.85rem .8rem;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
.tw{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:var(--r)}
.num{text-align:right;white-space:nowrap}
.bar{height:12px;background:var(--panel);border-radius:8px;overflow:hidden}.bar i{display:block;height:100%;border-radius:8px}

/* forms */
label.f{display:block;font-size:.78rem;color:var(--mut);font-weight:600;letter-spacing:.06em;text-transform:uppercase;margin-bottom:.8rem}
label.f>input,label.f>select,label.f>textarea{display:block;width:100%;margin-top:.35rem;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:.8rem .9rem;font-size:1.05rem;color:var(--txt);text-transform:none;letter-spacing:0;font-weight:500;min-height:50px}
label.f>input:focus,label.f>select:focus,label.f>textarea:focus{outline:2px solid var(--brava);border-color:transparent}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:0 1rem}
.chk{display:flex;gap:.45rem;flex-wrap:wrap;margin:.4rem 0 .9rem}
.chk label{cursor:pointer}
.chk input{display:none}
.chk span{display:inline-block;padding:.55rem .85rem;border-radius:12px;border:1px solid var(--line);background:var(--bg);font-weight:700;min-width:52px;text-align:center}
.chk input:checked+span{background:var(--brava);border-color:var(--brava);color:#fff}
.inl{display:flex;gap:.6rem;flex-wrap:wrap;align-items:flex-end}
.inl label.f{margin:0;flex:1;min-width:120px}

/* modal */
.ov{position:fixed;inset:0;background:rgba(5,9,18,.72);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;z-index:50;padding:1rem}
.ov.on{display:flex}
.mod{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:1.5rem;width:100%;max-width:560px;max-height:92vh;overflow:auto}
.mod h3{font-size:1.7rem;margin-bottom:1rem}
.mfoot{display:flex;gap:.7rem;justify-content:flex-end;margin-top:1rem;flex-wrap:wrap}

/* agenda */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:.6rem}
.day{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:.7rem;min-height:170px}
.day.hoy{border-color:var(--brava);box-shadow:0 0 0 1px var(--brava) inset}
.day h4{font-family:'Bebas Neue';font-weight:400;letter-spacing:.06em;font-size:1.1rem;color:var(--mut);margin-bottom:.5rem}
.day.hoy h4{color:var(--brava2)}
.ev{border-radius:10px;padding:.45rem .55rem;margin-bottom:.4rem;font-size:.82rem;cursor:pointer;line-height:1.25;border-left:4px solid var(--line);background:var(--card2)}
.ev b{display:block;font-size:.88rem}
.ev.taller{border-color:var(--ok)}.ev.funcion{border-color:var(--brava)}.ev.alquiler{border-color:var(--info)}.ev.ensayo{border-color:var(--warn)}
.ev.pisa{background:rgba(255,107,94,.18);outline:1px solid var(--bad)}
.month{display:grid;grid-template-columns:repeat(7,1fr);gap:.4rem}
.mday{background:var(--card);border:1px solid var(--line);border-radius:12px;min-height:82px;padding:.4rem;font-size:.75rem;cursor:pointer}
.mday.hoy{border-color:var(--brava)}.mday.fuera{opacity:.35}
.mday b{display:block;margin-bottom:.2rem;color:var(--mut)}
.dot{display:block;height:6px;border-radius:3px;margin-bottom:3px}
.setup{max-width:560px;margin:12vh auto;padding:1rem}

/* toasts */
#toasts{position:fixed;right:18px;bottom:92px;z-index:80;display:flex;flex-direction:column;gap:.5rem}
.toast{background:var(--card2);border:1px solid var(--line);padding:.8rem 1.1rem;border-radius:14px;font-weight:600;box-shadow:0 8px 30px rgba(0,0,0,.4)}
.toast.err{border-color:var(--bad)}
#sav{position:fixed;right:18px;top:14px;z-index:90;background:var(--card2);border:1px solid var(--line);color:var(--mut);font-size:.8rem;padding:.4rem .9rem;border-radius:20px;display:none}

@media(max-width:860px){
  html{font-size:16px}
  .app{grid-template-columns:1fr}
  .side{display:none}
  .main{padding:1.1rem 1rem 7rem}
  .h1{font-size:2.1rem}
  .bottom{display:grid;grid-template-columns:repeat(6,1fr);position:fixed;left:0;right:0;bottom:0;background:var(--panel);border-top:1px solid var(--line);z-index:40;padding:.4rem .2rem calc(.4rem + env(safe-area-inset-bottom))}
  .bottom button{background:none;border:0;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:.1rem;font-size:.66rem;font-weight:700;padding:.4rem .1rem;border-radius:12px}
  .bottom button .ic{font-size:1.45rem}
  .bottom button.on{color:var(--brava2)}
  .acts{grid-template-columns:1fr 1fr;gap:.7rem}
  .btn.big{min-height:84px;font-size:1rem}
  .week{grid-template-columns:1fr}
  .day{min-height:0}
  .f2{grid-template-columns:1fr}
  .stat .v{font-size:1.9rem}
  #toasts{bottom:96px;right:10px;left:10px}
}
@media print{
  .side,.bottom,.top .btn,#sav,#toasts,.tabs,.noprint{display:none!important}
  body,.card,.tw{background:#fff!important;color:#000!important;border-color:#999!important}
  *{color:#000!important}
}
</style>
</head>
<body>
<div id="sav">💾 Guardando…</div>
<div id="root"></div>
<div id="toasts"></div>
<div class="ov" id="ov"><div class="mod" id="mod"></div></div>
<script>
// ═══════════ CONFIG Y DATOS ═══════════
const URL_KEY = 'brava_url';
const URL_BRAVA = 'https://script.google.com/macros/s/AKfycbzwiMW95dCGLS7-O-T8MvcykJp8BvT30b3Kn0QtxuYE25WRlnd44zajYQXKcr2MblFfHQ/exec';
let APPS_URL = (() => { try { return localStorage.getItem(URL_KEY) || URL_BRAVA; } catch (e) { return URL_BRAVA; } })();
const TABLAS = ['Talleres','Alumnos','Pagos','Liquidaciones','Funciones','Reservas','Ensayos','Alquileres','Egresos','Retiros','Costos_Fijos','Ajustes'];
const T = {}; TABLAS.forEach(t => T[t] = []);

let queue = Promise.resolve(), pendientes = 0, tempSeq = 0;
const idMap = {};

function savInd() { const e = document.getElementById('sav'); if (e) e.style.display = pendientes > 0 ? 'block' : 'none'; }
window.addEventListener('beforeunload', e => { if (pendientes > 0) { e.preventDefault(); e.returnValue = ''; } });

function sust(o) {
  if (Array.isArray(o)) return o.map(sust);
  if (o && typeof o === 'object') { const r = {}; for (const k in o) r[k] = sust(o[k]); return r; }
  if (typeof o === 'number' && o < 0 && idMap[o]) return idMap[o];
  return o;
}

function enviar(op, onDone) {
  pendientes++; savInd();
  const p = queue.then(async () => {
    let res;
    try {
      const r = await fetch(APPS_URL, { method: 'POST', body: JSON.stringify({ ops: [sust(op)] }) });
      const j = await r.json();
      res = j.error ? { error: j.error } : (j.results[0] || {});
    } catch (e) { res = { error: 'Sin conexión' }; }
    if (onDone) onDone(res);
    return res;
  });
  queue = p.then(() => {}, () => {});
  return p.then(res => { pendientes--; savInd(); if (res.error) { toast('No se pudo guardar: ' + res.error, true); recargar(); } return res; });
}

// Escrituras: se ven al instante y se guardan en segundo plano
function add(tabla, row) {
  const temp = -(++tempSeq);
  T[tabla].push({ ...row, ID: temp });
  enviar({ op: 'add', tabla, row }, res => {
    if (!res.id) return;
    idMap[temp] = res.id;
    TABLAS.forEach(t => T[t].forEach(r => { for (const f in r) if (r[f] === temp) r[f] = res.id; }));
    if (vista.arg === temp) vista.arg = res.id;
  });
  return temp;
}
function upd(tabla, id, row) {
  const r = T[tabla].find(x => String(x.ID) === String(id));
  if (r) Object.assign(r, row);
  enviar({ op: 'update', tabla, id, row });
}
function del(tabla, id) {
  const i = T[tabla].findIndex(x => String(x.ID) === String(id));
  if (i >= 0) T[tabla].splice(i, 1);
  enviar({ op: 'delete', tabla, id });
}

function aplicar(data) { TABLAS.forEach(t => { T[t] = Array.isArray(data[t]) ? data[t] : []; }); }
async function recargar() {
  try {
    const d = await (await fetch(APPS_URL)).json();
    if (d.error) throw new Error(d.error);
    if (pendientes === 0) { aplicar(d); guardarLocal(); render(); }
  } catch (e) {}
}
function guardarLocal() { try { localStorage.setItem('brava_cache', JSON.stringify(T)); } catch (e) {} }

// ═══════════ UTILIDADES ═══════════
const $ = id => document.getElementById(id);
const esc = t => String(t ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = v => parseFloat(v) || 0;
const m$ = n => (num(n) < 0 ? '-$' : '$') + Math.abs(Math.round(num(n))).toLocaleString('es-AR');
const pad = n => String(n).padStart(2, '0');
const iso = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const hoy = () => iso(new Date());
const fromISO = s => { const [y, m, d] = String(s).slice(0, 10).split('-').map(Number); return new Date(y, m - 1, d); };
const addDias = (s, n) => { const d = fromISO(s); d.setDate(d.getDate() + n); return iso(d); };
const DIAS = ['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
const DIAS_LARGO = ['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
const MESES = ['','Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
const mesDe = f => String(f || '').slice(0, 7);
const fF = s => s ? (d => `${DIAS[d.getDay()]} ${pad(d.getDate())}/${pad(d.getMonth() + 1)}`)(fromISO(s)) : '—';
const fFull = s => s ? `${String(s).slice(8, 10)}/${String(s).slice(5, 7)}/${String(s).slice(0, 4)}` : '—';
const nomMes = k => `${MESES[parseInt(k.slice(5))]} ${k.slice(0, 4)}`;
const lunesDe = s => { const d = fromISO(s); const w = (d.getDay() + 6) % 7; d.setDate(d.getDate() - w); return iso(d); };
const hh = t => String(t || '').slice(0, 5);

const DEF = { pin: '1234', seguro: 150000, pct_sala: 30, equipamiento: 50000, puesta_luces: 15000, hora_ensayo: 18000,
  argentores: 10, capacidad: 40, alquiler_sugerido: 300000, precio_general: 15000, precio_solidaria: 20000 };
const cfg = k => { const r = T.Ajustes.find(a => a.Clave === k); return r && r.Valor !== '' ? (k === 'pin' ? String(r.Valor) : num(r.Valor)) : DEF[k]; };
function setCfg(k, v) { const r = T.Ajustes.find(a => a.Clave === k); if (r) upd('Ajustes', r.ID, { Valor: v }); else add('Ajustes', { Clave: k, Valor: v }); }

function toast(msg, err) {
  const el = document.createElement('div');
  el.className = 'toast' + (err ? ' err' : '');
  el.textContent = (err ? '❌ ' : '✅ ') + msg;
  $('toasts').appendChild(el);
  setTimeout(() => el.remove(), 2600);
}

// ═══════════ FORMULARIOS Y MODALES ═══════════
function cerrar() { $('ov').classList.remove('on'); }
function abrirModal(html) { $('mod').innerHTML = html; $('ov').classList.add('on'); }
$('ov').addEventListener('mousedown', e => { if (e.target.id === 'ov') cerrar(); });

// fields: [{id,label,type:text|number|date|time|select|dias|area,value,options:[[v,label]],ph,half}]
let formCb = null;
function campoHTML(f) {
  const ev = f.onInput || '';
  let inp;
  if (f.type === 'select') inp = `<select id="ff_${f.id}" ${ev ? `onchange="${ev}"` : ''}>${f.options.map(o => { const [v, l] = Array.isArray(o) ? o : [o, o]; return `<option value="${esc(v)}" ${String(f.value) === String(v) ? 'selected' : ''}>${esc(l)}</option>`; }).join('')}</select>`;
  else if (f.type === 'dias') return `<label class="f">${esc(f.label)}</label><div class="chk">${['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'].map(d => `<label><input type="checkbox" class="ffd" value="${d}" ${(f.value || '').includes(d) ? 'checked' : ''}><span>${d}</span></label>`).join('')}</div>`;
  else if (f.type === 'area') inp = `<textarea id="ff_${f.id}" rows="2" placeholder="${esc(f.ph || '')}">${esc(f.value ?? '')}</textarea>`;
  else {
    const dl = f.options ? `<datalist id="dl_${f.id}">${f.options.map(o => `<option value="${esc(o)}">`).join('')}</datalist>` : '';
    inp = `<input id="ff_${f.id}" type="${f.type || 'text'}" value="${esc(f.value ?? '')}" placeholder="${esc(f.ph || '')}" ${f.options ? `list="dl_${f.id}"` : ''} ${f.type === 'number' ? 'inputmode="decimal"' : ''} ${ev ? `oninput="${ev}"` : ''}>${dl}`;
  }
  return `<label class="f">${esc(f.label)}${inp}</label>`;
}
function form(titulo, fields, onSave, opts = {}) {
  formCb = { fields, onSave, borrar: opts.borrar };
  let h = `<h3>${esc(titulo)}</h3>`;
  for (let i = 0; i < fields.length; i++) {
    if (fields[i].half && fields[i + 1] && fields[i + 1].half) { h += `<div class="f2">${campoHTML(fields[i])}${campoHTML(fields[i + 1])}</div>`; i++; }
    else h += campoHTML(fields[i]);
  }
  h += `<div class="mfoot">${opts.borrar ? `<button class="btn d" onclick="formBorrar()">🗑 Eliminar</button><span class="sp"></span>` : ''}
    <button class="btn g" onclick="cerrar()">Cancelar</button><button class="btn p" onclick="formGuardar()">${opts.boton || 'Guardar'}</button></div>`;
  abrirModal(h);
  setTimeout(() => { const f = $('mod').querySelector('input:not([type=checkbox]),select'); if (f) f.focus(); }, 60);
}
function formVals() {
  const v = {};
  formCb.fields.forEach(f => {
    if (f.type === 'dias') v[f.id] = [...document.querySelectorAll('.ffd:checked')].map(x => x.value).join(',');
    else v[f.id] = $('ff_' + f.id).value;
  });
  return v;
}
function formGuardar() { const r = formCb.onSave(formVals()); if (r !== false) cerrar(); }
function formBorrar() { if (confirm('¿Eliminar? No se puede deshacer.')) { formCb.borrar(); cerrar(); } }

// ═══════════ CÁLCULOS DE NEGOCIO ═══════════
// — Talleres
const tallerActivo = t => String(t.Activo) !== 'No';
const alumnosDe = tid => T.Alumnos.filter(a => String(a.ID_Taller) === String(tid) && a.Estado !== 'Baja');
function cuotaDe(a) {
  const t = T.Talleres.find(t => String(t.ID) === String(a.ID_Taller));
  return a['Cuota propia'] !== '' && a['Cuota propia'] != null ? num(a['Cuota propia']) : num(t && t.Cuota);
}
const pagadoMes = (aid, mes) => T.Pagos.filter(p => String(p.ID_Alumno) === String(aid) && p.Mes === mes).reduce((s, p) => s + num(p.Monto), 0);
function estadoAlumno(a, mes) {
  const c = cuotaDe(a), p = pagadoMes(a.ID, mes);
  if (c <= 0) return { k: 'beca', c, p, falta: 0 };
  if (p >= c) return { k: 'ok', c, p, falta: 0 };
  return { k: p > 0 ? 'parcial' : 'debe', c, p, falta: c - p };
}
const docentesDe = t => {
  let d = []; try { d = JSON.parse(t.Docentes || '[]') || []; } catch (e) {}
  d = d.filter(x => x && x.n);
  return d.length ? d : [{ n: t.Profesor || 'Profe', p: 100 }];
};
function tallerMes(t, mes) {
  const rec = T.Pagos.filter(p => String(p.ID_Taller) === String(t.ID) && p.Mes === mes).reduce((s, p) => s + num(p.Monto), 0);
  const profe = rec * num(t['% Profe']) / 100;
  const liqs = T.Liquidaciones.filter(l => String(l.ID_Taller) === String(t.ID) && l.Mes === mes);
  const docs = docentesDe(t).map((d, i) => {
    const monto = profe * num(d.p) / 100;
    const pagado = liqs.filter(l => (l.Docente || '') === d.n || (!l.Docente && i === 0)).reduce((s, l) => s + num(l.Monto), 0);
    return { n: d.n, p: num(d.p), monto, pagado, debe: Math.max(0, Math.round(monto - pagado)) };
  });
  const liq = docs.reduce((s, d) => s + d.pagado, 0);
  return { rec, profe, brava: rec - profe, liq, docs, debeProfe: docs.reduce((s, d) => s + d.debe, 0) };
}

// — Teatro
const reservasDe = fid => T.Reservas.filter(r => String(r.ID_Funcion) === String(fid));
const ingreso = r => r.Estado === 'Ingresó';
const ajF = f => { try { return JSON.parse(f.Ajustes || '{}') || {}; } catch (e) { return {}; } };
function funcCalc(f) {
  const o = ajF(f), pick = (k, d) => (o[k] !== undefined && o[k] !== '' ? num(o[k]) : d);
  const rs = reservasDe(f.ID), ings = rs.filter(ingreso);
  const pagas = ings.filter(r => num(r.Monto) > 0);
  const rec = pagas.reduce((s, r) => s + num(r.Monto), 0);
  const porMedio = {};
  pagas.forEach(r => { const m = r.Medio || 'Otro'; porMedio[m] = (porMedio[m] || 0) + num(r.Monto); });
  const argPct = f.Argentores === 'No' ? 0 : pick('arg', cfg('argentores'));
  const arg = rec * argPct / 100;
  const neto = rec - arg;
  const pctSala = pick('pct', cfg('pct_sala')), equip = pick('eq', cfg('equipamiento')), seguro = pick('seg', cfg('seguro'));
  const puesta = pick('pl', (f['Primera función'] === 'Sí' && f['Técnico'] !== 'Propio') ? cfg('puesta_luces') : 0);
  const porcentaje = neto * pctSala / 100 + equip + puesta;
  const seguroAplica = seguro > porcentaje;
  const brava = Math.max(0, Math.max(porcentaje, seguro) - num(f['Brava absorbe']));
  const ensayo = num(f['Ensayo cobrado']);
  const elenco = neto - brava - ensayo;
  const cant = a => a.reduce((s, r) => s + (num(r.Cantidad) || 1), 0);
  return { rs, ings, rec, porMedio, arg, argPct, neto, pctSala, equip, seguro, porcentaje, puesta, seguroAplica, brava, ensayo, bravaTotal: brava + ensayo, elenco, ov: o, editado: Object.keys(o).length > 0,
    personas: cant(rs), ingresaron: cant(ings), pagasCant: cant(pagas), invitados: cant(ings) - cant(pagas), vacia: ings.length === 0,
    chequeo: Math.round(arg + brava + ensayo + elenco) === Math.round(rec) };
}

// — Alquileres
const alqCobrado = a => (num(a.Seña) > 0 && a['Fecha seña'] ? num(a.Seña) : 0) + (a['Fecha saldo'] ? num(a.Monto) - num(a.Seña) : 0);
const alqSaldo = a => a['Fecha saldo'] ? 0 : num(a.Monto) - (num(a.Seña) > 0 ? num(a.Seña) : 0);

// — Ingresos de todo el espacio (se arman solos)
function ingresosAuto() {
  const out = [];
  T.Pagos.forEach(p => {
    const t = T.Talleres.find(t => String(t.ID) === String(p.ID_Taller));
    const a = T.Alumnos.find(a => String(a.ID) === String(p.ID_Alumno));
    const pct = num(t && t['% Profe']);
    out.push({ fecha: String(p.Fecha).slice(0, 10), origen: 'Talleres', detalle: `${t ? t.Nombre : 'Taller'} · ${a ? a.Nombre : ''}`, monto: num(p.Monto) * (100 - pct) / 100, bruto: num(p.Monto), medio: p.Medio });
  });
  T.Funciones.forEach(f => {
    const c = funcCalc(f);
    if (c.vacia) return;
    out.push({ fecha: String(f.Fecha).slice(0, 10), origen: 'Teatro', detalle: `${f.Obra} (Op. ${f.Modalidad || 'A'})`, monto: c.bravaTotal, pendiente: f.Estado !== 'Liquidada' && f.Modalidad === 'B' });
  });
  T.Alquileres.forEach(a => {
    if (num(a.Seña) > 0 && a['Fecha seña']) out.push({ fecha: String(a['Fecha seña']).slice(0, 10), origen: 'Alquiler', detalle: `Seña · ${a.Evento}`, monto: num(a.Seña), medio: a.Medio });
    if (a['Fecha saldo']) out.push({ fecha: String(a['Fecha saldo']).slice(0, 10), origen: 'Alquiler', detalle: `${num(a.Seña) > 0 ? 'Saldo' : 'Pago'} · ${a.Evento}`, monto: num(a.Monto) - num(a.Seña), medio: a.Medio });
  });
  return out.filter(x => x.fecha);
}

// — Pendientes: lo que hay que cobrar y lo que hay que pagar
function pendientesCalc() {
  const mes = hoy().slice(0, 7);
  const cobrar = [], pagar = [];
  T.Talleres.filter(tallerActivo).forEach(t => alumnosDe(t.ID).forEach(a => {
    const e = estadoAlumno(a, mes);
    if (e.falta > 0) cobrar.push({ tipo: 'cuota', texto: `${a.Nombre} · ${t.Nombre}`, monto: e.falta, go: ['talleres', t.ID] });
  }));
  T.Alquileres.forEach(a => { const s = alqSaldo(a); if (s > 0) cobrar.push({ tipo: 'alquiler', texto: `${num(a.Seña) > 0 ? 'Saldo' : 'Pago'} · ${a.Evento}`, monto: s, go: ['alquileres'] }); });
  T.Funciones.forEach(f => {
    const c = funcCalc(f); if (c.vacia || f.Estado === 'Liquidada') return;
    if (f.Modalidad === 'B') cobrar.push({ tipo: 'funcionB', texto: `Elenco de ${f.Obra} transfiere a Brava`, monto: c.bravaTotal, go: ['teatro', f.ID] });
    else {
      if (c.elenco > 0) pagar.push({ tipo: 'elenco', texto: `Elenco de ${f.Obra} (${fF(f.Fecha)})`, monto: c.elenco, go: ['teatro', f.ID] });
      if (c.arg > 0) pagar.push({ tipo: 'argentores', texto: `Argentores · ${f.Obra}`, monto: c.arg, go: ['teatro', f.ID] });
    }
  });
  T.Talleres.forEach(t => {
    const meses = [...new Set(T.Pagos.filter(p => String(p.ID_Taller) === String(t.ID)).map(p => p.Mes))].filter(Boolean);
    meses.forEach(m => { const x = tallerMes(t, m); x.docs.forEach(d => { if (d.debe > 0) pagar.push({ tipo: 'profe', texto: `${x.docs.length > 1 ? d.n : 'Profe'} · ${t.Nombre} · ${nomMes(m)}`, monto: d.debe, go: ['talleres', t.ID] }); }); });
  });
  T.Egresos.filter(e => e.Estado === 'Pendiente').forEach(e => pagar.push({ tipo: 'egreso', texto: e.Concepto, monto: num(e.Monto), go: ['cuentas', 'egresos'] }));
  return { cobrar, pagar, totC: cobrar.reduce((s, x) => s + x.monto, 0), totP: pagar.reduce((s, x) => s + x.monto, 0) };
}

// — Agenda
function itemsDelDia(fecha) {
  const out = [];
  const dow = DIAS[fromISO(fecha).getDay()];
  T.Talleres.filter(tallerActivo).forEach(t => { if (String(t['Días']).split(',').includes(dow)) out.push({ tipo: 'taller', titulo: t.Nombre, sub: t.Profesor, desde: hh(t.Desde), hasta: hh(t.Hasta), go: ['talleres', t.ID] }); });
  T.Funciones.filter(f => String(f.Fecha).slice(0, 10) === fecha).forEach(f => out.push({ tipo: 'funcion', titulo: '🎭 ' + f.Obra, sub: 'Función', desde: hh(f.Desde) || '21:00', hasta: hh(f.Hasta) || '22:30', go: ['teatro', f.ID] }));
  T.Alquileres.filter(a => String(a.Fecha).slice(0, 10) === fecha).forEach(a => out.push({ tipo: 'alquiler', titulo: a.Evento, sub: 'Alquiler' + (a.Responsable ? ' · ' + a.Responsable : ''), desde: hh(a.Desde), hasta: hh(a.Hasta), go: ['alquileres'] }));
  T.Ensayos.filter(e => String(e.Fecha).slice(0, 10) === fecha).forEach(e => out.push({ tipo: 'ensayo', titulo: e['Título'], sub: 'Ensayo', desde: hh(e.Desde), hasta: hh(e.Hasta), id: e.ID, go: ['ensayo', e.ID] }));
  out.sort((a, b) => (a.desde || '99').localeCompare(b.desde || '99'));
  out.forEach((x, i) => { x.pisa = out.some((y, j) => j !== i && x.desde && y.desde && x.hasta && y.hasta && x.desde < y.hasta && y.desde < x.hasta); });
  return out;
}

let mesTaller = hoy().slice(0, 7);
const mesMover = n => { const d = fromISO(mesTaller + '-01'); d.setMonth(d.getMonth() + n); mesTaller = iso(d).slice(0, 7); render(); };

function vTalleres() {
  if (vista.arg) return vTallerDetalle(vista.arg);
  const ts = T.Talleres.filter(tallerActivo);
  return head('TALLE<em>RES</em>', 'Alumnos, cuotas y reparto con cada profe', `<button class="btn p" onclick="formTaller()">+ Taller</button>`) + `
  <div class="grid g3">${ts.map(t => {
    const al = alumnosDe(t.ID), mes = hoy().slice(0, 7), m = tallerMes(t, mes);
    const deben = al.filter(a => estadoAlumno(a, mes).falta > 0).length;
    return `<div class="card" style="cursor:pointer" onclick="go('talleres',${t.ID})">
      <div class="h1" style="font-size:1.7rem">${esc(t.Nombre)}</div>
      <div class="sub">${esc(t.Profesor)} · ${esc(String(t['Días']).split(',').join(' '))} ${hh(t.Desde)}–${hh(t.Hasta)}</div>
      <div class="row" style="margin-top:1rem"><span class="chip in">${al.length} alumnos</span><span class="chip ${deben ? 'bad' : 'ok'}">${deben ? deben + ' deben' : 'Al día'}</span><span class="chip vi">${m$(t.Cuota)}/mes</span></div>
      <div class="mut" style="margin-top:.8rem;font-size:.9rem">Cobrado este mes: <b class="txt">${m$(m.rec)}</b></div></div>`;
  }).join('') || '<div class="empty card" style="grid-column:1/-1">Todavía no hay talleres. Tocá “+ Taller”.</div>'}</div>`;
}

function formTaller(id) {
  const t = id ? T.Talleres.find(x => String(x.ID) === String(id)) : null;
  form(t ? 'EDITAR TALLER' : 'NUEVO TALLER', [
    { id: 'n', label: 'Nombre del taller', value: t ? t.Nombre : '' },
    { id: 'd', label: 'Días', type: 'dias', value: t ? t['Días'] : '' },
    { id: 'de', label: 'Desde', type: 'time', value: t ? hh(t.Desde) : '19:00', half: true },
    { id: 'ha', label: 'Hasta', type: 'time', value: t ? hh(t.Hasta) : '20:30', half: true },
    { id: 'c', label: 'Cuota mensual ($)', type: 'number', value: t ? t.Cuota : '', half: true },
    { id: 'pc', label: '% para el profe', type: 'number', value: t ? t['% Profe'] : 70, half: true },
    ...[0, 1, 2, 3].flatMap(i => { const d = t ? docentesDe(t)[i] : (i === 0 ? { n: '', p: 100 } : null);
      return [{ id: 'dn' + i, label: i === 0 ? 'Profesor/a' : 'Docente ' + (i + 1) + ' (opcional)', value: d ? d.n : '', half: true },
              { id: 'dp' + i, label: '% de lo del profe', type: 'number', value: d ? d.p : '', ph: i === 0 ? '100' : '0', half: true }]; })
  ], v => {
    if (!v.n || !v.c) { toast('Falta el nombre o la cuota', true); return false; }
    const docs = [0, 1, 2, 3].map(i => ({ n: (v['dn' + i] || '').trim(), p: num(v['dp' + i]) })).filter(d => d.n);
    if (docs.length > 1 && Math.round(docs.reduce((s, d) => s + d.p, 0) * 100) !== 10000) { toast('Los porcentajes de los docentes tienen que sumar 100 (ahora suman ' + docs.reduce((s, d) => s + d.p, 0) + ')', true); return false; }
    if (docs.length === 1) docs[0].p = 100;
    const row = { Nombre: v.n, Profesor: docs.map(d => d.n).join(' · '), Docentes: docs.length > 1 ? JSON.stringify(docs) : '', 'Días': v.d, Desde: v.de, Hasta: v.ha, Cuota: v.c, '% Profe': v.pc, Activo: 'Sí' };
    if (t) upd('Talleres', t.ID, row); else { const id = add('Talleres', row); vista = { v: 'talleres', arg: id }; }
    toast('Taller guardado'); render();
  }, t ? { borrar: () => { alumnosDe(t.ID).concat(T.Alumnos.filter(a => String(a.ID_Taller) === String(t.ID))).forEach(a => { T.Pagos.filter(p => String(p.ID_Alumno) === String(a.ID)).forEach(p => del('Pagos', p.ID)); del('Alumnos', a.ID); }); del('Talleres', t.ID); vista = { v: 'talleres', arg: null }; render(); } } : {});
}

function vTallerDetalle(id) {
  const t = T.Talleres.find(x => String(x.ID) === String(id));
  if (!t) { vista.arg = null; return vTalleres(); }
  const al = alumnosDe(t.ID), m = tallerMes(t, mesTaller);
  const est = al.map(a => ({ a, e: estadoAlumno(a, mesTaller) }));
  const deben = est.filter(x => x.e.falta > 0);
  return `<button class="btn s g" onclick="go('talleres')" style="margin-bottom:1rem">← Talleres</button>` +
    head(esc(t.Nombre).toUpperCase(), `${esc(t.Profesor)} · ${esc(String(t['Días']).split(',').join(' '))} ${hh(t.Desde)}–${hh(t.Hasta)} · cuota ${m$(t.Cuota)} · ${t['% Profe']}% profe`,
      `<button class="btn" onclick="formTaller(${t.ID})">✏️ Editar</button><button class="btn p" onclick="formAlumno(${t.ID})">+ Alumno</button>`) + `
  <div class="row" style="margin-bottom:1rem"><button class="btn" onclick="mesMover(-1)">←</button><b style="font-size:1.3rem;min-width:170px;text-align:center">${nomMes(mesTaller)}</b><button class="btn" onclick="mesMover(1)">→</button></div>
  <div class="grid g4" style="margin-bottom:1.2rem">
    ${stat('Cobrado en el mes', m$(m.rec))}${stat('Para el profe', m$(m.profe))}${stat('Se queda en Brava', m$(m.brava), 'ok')}${stat('Alumnos que deben', deben.length, deben.length ? 'bad' : 'ok')}
  </div>
  ${m.profe > 0 ? `<div class="card" style="margin-bottom:1.2rem"><div class="sub" style="margin-bottom:.4rem;text-transform:uppercase;letter-spacing:.08em">Liquidación a ${m.docs.length > 1 ? 'los docentes' : 'el profe'} · ${m$(m.profe)}</div>
    ${m.docs.map((d, i) => `<div class="row" style="padding:.45rem 0;border-top:1px solid var(--line)"><div><b>${esc(d.n)}</b>${m.docs.length > 1 ? ` <span class="mut">· ${d.p}%</span>` : ''}<div class="sub">${m$(d.monto)} · pagado ${m$(d.pagado)} · falta <b class="${d.debe ? 'warn' : 'ok'}">${m$(d.debe)}</b></div></div><span class="sp"></span>
      ${d.debe > 0 ? `<button class="btn ok2" onclick="pagarProfe(${t.ID},${i})">✅ Ya le pagué</button>` : '<span class="chip ok">Al día</span>'}</div>`).join('')}
    ${m.docs.length > 1 && m.docs.filter(d => d.debe > 0).length > 1 ? `<div style="margin-top:.6rem"><button class="btn ok2" onclick="pagarProfe(${t.ID},'all')">✅ Ya les pagué a todos</button></div>` : ''}</div>` : ''}
  <div class="card"><div class="list">${est.length ? est.map(({ a, e }) => `<div class="item">
      <div style="flex:1;min-width:160px;cursor:pointer" onclick="historial(${a.ID})"><div class="t">${esc(a.Nombre)}</div><div class="d">${esc(a['Teléfono'] || '')}${a['Cuota propia'] !== '' && a['Cuota propia'] != null ? ` · cuota propia ${m$(a['Cuota propia'])}` : ''}</div></div>
      ${e.k === 'ok' ? `<span class="chip ok">Pagó ${m$(e.p)}</span>` : e.k === 'beca' ? '<span class="chip vi">Beca</span>' : e.k === 'parcial' ? `<span class="chip warn">Pagó ${m$(e.p)} · falta ${m$(e.falta)}</span>` : `<span class="chip bad">Debe ${m$(e.falta)}</span>`}
      ${e.falta > 0 ? `<button class="btn p s" onclick="cobrarCuota(${a.ID})">💵 Cobrar</button>` : ''}
      <button class="btn s g" onclick="formAlumno(${t.ID},${a.ID})">✏️</button></div>`).join('') : '<div class="empty">Todavía no hay alumnos. Tocá “+ Alumno”.</div>'}</div></div>`;
}

function formAlumno(tid, id) {
  const a = id ? T.Alumnos.find(x => String(x.ID) === String(id)) : null;
  form(a ? 'EDITAR ALUMNO' : 'NUEVO ALUMNO', [
    { id: 'n', label: 'Nombre y apellido', value: a ? a.Nombre : '' },
    { id: 't', label: 'Teléfono', value: a ? a['Teléfono'] : '', ph: 'Opcional' },
    { id: 'c', label: 'Cuota propia ($)', type: 'number', value: a ? a['Cuota propia'] : '', ph: 'Vacío = cuota del taller · 0 = beca' }
  ], v => {
    if (!v.n.trim()) { toast('Falta el nombre', true); return false; }
    const row = { Nombre: v.n.trim(), 'Teléfono': v.t, 'Cuota propia': v.c, ID_Taller: tid, Estado: 'Activo' };
    if (a) upd('Alumnos', a.ID, row); else add('Alumnos', { ...row, 'Fecha alta': hoy() });
    toast('Alumno guardado'); render();
  }, a ? { borrar: () => { T.Pagos.filter(p => String(p.ID_Alumno) === String(a.ID)).forEach(p => del('Pagos', p.ID)); del('Alumnos', a.ID); render(); } } : {});
}

function cobrarCuota(aid, mes, lista) {
  mes = mes || mesTaller;
  const a = T.Alumnos.find(x => String(x.ID) === String(aid));
  const e = estadoAlumno(a, mes);
  const meses = [-1, 0, 1].map(n => { const d = fromISO(hoy().slice(0, 7) + '-01'); d.setMonth(d.getMonth() + n); return iso(d).slice(0, 7); });
  if (!meses.includes(mes)) meses.push(mes);
  const campos = [];
  if (lista) campos.push({ id: 'a', label: 'Alumno', type: 'select', value: aid, options: lista.map(x => [x.a.ID, `${x.a.Nombre} · ${x.t.Nombre}`]), onInput: 'cuotaCambio()' });
  campos.push({ id: 'm', label: 'Mes que paga', type: 'select', value: mes, options: meses.sort().map(k => [k, nomMes(k)]), onInput: 'cuotaCambio()' });
  campos.push({ id: 'mo', label: 'Monto ($)', type: 'number', value: e.falta || cuotaDe(a), half: true });
  campos.push({ id: 'me', label: 'Medio', type: 'select', value: 'Efectivo', options: ['Efectivo', 'Transferencia', 'Mercado Pago'], half: true });
  campos.push({ id: 'f', label: 'Fecha del pago', type: 'date', value: hoy() });
  form('COBRAR CUOTA', campos, v => {
    const al = T.Alumnos.find(x => String(x.ID) === String(v.a || aid));
    if (!num(v.mo)) { toast('Falta el monto', true); return false; }
    add('Pagos', { ID_Alumno: al.ID, ID_Taller: al.ID_Taller, Mes: v.m, Monto: num(v.mo), Medio: v.me, Fecha: v.f });
    toast(`Cobrado ${m$(v.mo)} · ${al.Nombre}`); render();
  }, { boton: '✅ Registrar pago' });
}
function cuotaCambio() {
  const aid = $('ff_a') ? $('ff_a').value : null; if (!aid) return;
  const a = T.Alumnos.find(x => String(x.ID) === String(aid)), e = estadoAlumno(a, $('ff_m').value);
  $('ff_mo').value = e.falta || cuotaDe(a);
}

function historial(aid) {
  const a = T.Alumnos.find(x => String(x.ID) === String(aid));
  const ps = T.Pagos.filter(p => String(p.ID_Alumno) === String(aid)).sort((x, y) => String(y.Fecha).localeCompare(String(x.Fecha)));
  abrirModal(`<h3>${esc(a.Nombre)}</h3><div class="sub" style="margin-bottom:.8rem">Historial de pagos</div>
    <div class="list">${ps.length ? ps.map(p => `<div class="item"><div style="flex:1"><div class="t">${m$(p.Monto)} · ${nomMes(p.Mes)}</div><div class="d">${fFull(p.Fecha)} · ${esc(p.Medio)}</div></div><button class="btn d s" onclick="if(confirm('¿Eliminar este pago?')){del('Pagos',${p.ID});historial(${aid});render()}">🗑</button></div>`).join('') : '<div class="empty">Sin pagos todavía</div>'}</div>
    <div class="mfoot"><button class="btn" onclick="cerrar()">Cerrar</button></div>`);
}

function pagarProfe(tid, idx) {
  const t = T.Talleres.find(x => String(x.ID) === String(tid)), m = tallerMes(t, mesTaller);
  const ds = (idx === 'all' ? m.docs : [m.docs[idx]]).filter(d => d.debe > 0);
  if (!ds.length) return;
  if (!confirm(`¿Confirmás que pagaste ${ds.map(d => `${m$(d.debe)} a ${d.n}`).join(' y ')} por ${nomMes(mesTaller)}?`)) return;
  ds.forEach(d => add('Liquidaciones', { ID_Taller: t.ID, Mes: mesTaller, Docente: d.n, Monto: d.debe, 'Fecha pago': hoy() }));
  toast('Liquidación registrada'); render();
}

// ═══════════ TEATRO ═══════════
let teatroMes = '';
function vTeatro() {
  if (vista.arg) return vFuncion(vista.arg);
  const meses = [...new Set([hoy().slice(0, 7), ...T.Funciones.map(f => mesDe(f.Fecha))])].filter(Boolean).sort().reverse();
  if (teatroMes === '' || (teatroMes !== 'todos' && !meses.includes(teatroMes))) teatroMes = hoy().slice(0, 7);
  const fs = T.Funciones.filter(f => teatroMes === 'todos' || mesDe(f.Fecha) === teatroMes).sort((a, b) => String(a.Fecha).localeCompare(String(b.Fecha)) || String(a.Desde).localeCompare(String(b.Desde)));
  const rows = fs.map(f => ({ f, c: funcCalc(f) }));
  const suma = fn => rows.reduce((s, x) => s + fn(x.c), 0);
  return head('TEA<em>TRO</em>', 'Funciones, lista de ingreso y bordereaux', `<button class="btn p" onclick="formFuncion()">+ Función</button>`) + `
  <div class="tabs">${meses.map(m => `<button class="tab ${teatroMes === m ? 'on' : ''}" onclick="teatroMes='${m}';render()">${nomMes(m)}</button>`).join('')}<button class="tab ${teatroMes === 'todos' ? 'on' : ''}" onclick="teatroMes='todos';render()">Todos</button></div>
  <div class="grid g4" style="margin-bottom:1.2rem">${stat('Funciones', rows.length)}${stat('Recaudado', m$(suma(c => c.rec)))}${stat('Se queda en Brava', m$(suma(c => c.bravaTotal)), 'ok')}${stat('Va a los elencos', m$(suma(c => c.elenco)))}</div>
  <div class="grid g2">${rows.map(({ f, c }) => `<div class="card" style="cursor:pointer" onclick="go('teatro',${f.ID})">
    <div class="row"><div class="time" style="min-width:0">${fF(f.Fecha)}</div><span class="sp"></span><span class="chip ${f.Estado === 'Liquidada' ? 'ok' : 'warn'}">${f.Estado === 'Liquidada' ? 'Liquidada' : 'Pendiente'}</span><span class="chip vi">Op. ${f.Modalidad || 'A'}</span></div>
    <div class="h1" style="font-size:1.7rem;margin-top:.3rem">${esc(f.Obra)}</div>
    <div class="sub">${c.personas} reservas · ${c.ingresaron} ingresaron${c.vacia ? '' : ` · recaudó ${m$(c.rec)}`}</div>
    ${c.vacia ? '' : `<div class="row" style="margin-top:.7rem"><span class="chip ok">Brava ${m$(c.bravaTotal)}</span><span class="chip in">Elenco ${m$(c.elenco)}</span>${c.seguroAplica ? '<span class="chip br">seguro de sala</span>' : ''}${c.editado ? '<span class="chip warn">ajustada</span>' : ''}</div>`}</div>`).join('') || '<div class="empty card" style="grid-column:1/-1">Todavía no hay funciones en este período. Tocá “+ Función”.</div>'}</div>`;
}

function funcPrefill() {
  const o = $('ff_o').value.trim().toLowerCase();
  const p = T.Funciones.filter(f => String(f.Obra).toLowerCase() === o).sort((a, b) => String(b.Fecha).localeCompare(String(a.Fecha)))[0];
  if (!p) return;
  $('ff_mo').value = p.Modalidad || 'A'; $('ff_ar').value = p.Argentores || 'Sí'; $('ff_te').value = p['Técnico'] || 'Brava';
  $('ff_pg').value = p['Precio general'] || cfg('precio_general'); $('ff_ps').value = p['Precio solidaria'] || cfg('precio_solidaria'); $('ff_pr').value = 'No';
  $('ff_de').value = hh(p.Desde) || '21:00'; $('ff_ha').value = hh(p.Hasta) || '22:30';
}

function formFuncion(id) {
  const f = id ? T.Funciones.find(x => String(x.ID) === String(id)) : null;
  form(f ? 'EDITAR FUNCIÓN' : 'NUEVA FUNCIÓN', [
    { id: 'o', label: 'Obra', value: f ? f.Obra : '', options: [...new Set(T.Funciones.map(x => x.Obra))], onInput: f ? '' : 'funcPrefill()' },
    { id: 'f', label: 'Fecha', type: 'date', value: f ? String(f.Fecha).slice(0, 10) : hoy() },
    { id: 'de', label: 'Desde', type: 'time', value: f ? hh(f.Desde) : '21:00', half: true },
    { id: 'ha', label: 'Hasta', type: 'time', value: f ? hh(f.Hasta) : '22:30', half: true },
    { id: 'mo', label: 'Modalidad', type: 'select', value: f ? f.Modalidad : 'A', options: [['A', 'A · Brava vende'], ['B', 'B · El elenco vende']], half: true },
    { id: 'ar', label: 'Argentores', type: 'select', value: f ? f.Argentores : 'Sí', options: [['Sí', 'Sí (10%)'], ['No', 'No']], half: true },
    { id: 'pg', label: 'Precio general ($)', type: 'number', value: f ? f['Precio general'] : cfg('precio_general'), half: true },
    { id: 'ps', label: 'Precio solidaria ($)', type: 'number', value: f ? f['Precio solidaria'] : cfg('precio_solidaria'), half: true },
    { id: 'pr', label: 'Primera función', type: 'select', value: f ? f['Primera función'] : 'Sí', options: [['Sí', 'Sí (puesta de luces)'], ['No', 'No']], half: true },
    { id: 'te', label: 'Técnico', type: 'select', value: f ? f['Técnico'] : 'Brava', options: [['Brava', 'Lo pone Brava'], ['Propio', 'Trae el suyo']], half: true },
    { id: 'en', label: 'Ensayos a cobrar ($)', type: 'number', value: f ? f['Ensayo cobrado'] : '', ph: '0', half: true },
    { id: 'ab', label: 'Brava absorbe ($)', type: 'number', value: f ? f['Brava absorbe'] : '', ph: '0', half: true },
    { id: 'n', label: 'Notas', type: 'area', value: f ? f.Notas : '' }
  ], v => {
    if (!v.o.trim() || !v.f) { toast('Falta la obra o la fecha', true); return false; }
    const row = { Obra: v.o.trim(), Fecha: v.f, Desde: v.de, Hasta: v.ha, Modalidad: v.mo, Argentores: v.ar, 'Primera función': v.pr, 'Técnico': v.te,
      'Precio general': v.pg, 'Precio solidaria': v.ps, 'Ensayo cobrado': v.en, 'Brava absorbe': v.ab, Notas: v.n };
    if (f) { upd('Funciones', f.ID, row); toast('Función actualizada'); render(); }
    else { const nid = add('Funciones', { ...row, Estado: 'Pendiente' }); toast('Función creada'); go('teatro', nid); }
  }, f ? { borrar: () => { reservasDe(f.ID).forEach(r => del('Reservas', r.ID)); del('Funciones', f.ID); go('teatro'); } } : {});
}

function vFuncion(id) {
  const f = T.Funciones.find(x => String(x.ID) === String(id));
  if (!f) { vista.arg = null; return vTeatro(); }
  const c = funcCalc(f), cap = cfg('capacidad'), tab = vista.tab || 'lista';
  const pct = Math.min(100, c.personas / cap * 100);
  return `<button class="btn s g" onclick="go('teatro')" style="margin-bottom:1rem">← Teatro</button>` +
    head(esc(f.Obra).toUpperCase(), `${fF(f.Fecha)} ${hh(f.Desde)} · Opción ${f.Modalidad || 'A'} ${f.Modalidad === 'B' ? '(el elenco vende)' : '(Brava vende)'}`, `<button class="btn" onclick="formFuncion(${f.ID})">✏️ Editar</button>`) + `
  <div class="card" style="margin-bottom:1.2rem"><div class="row"><b>${c.personas} / ${cap} lugares</b><span class="mut">· ingresaron ${c.ingresaron}</span>${c.personas > cap ? '<span class="chip bad">⚠ supera la capacidad</span>' : ''}</div>
    <div class="bar" style="margin-top:.6rem"><i style="width:${pct}%;background:${c.personas > cap ? 'var(--bad)' : 'var(--brava)'}"></i></div></div>
  <div class="tabs"><button class="tab ${tab === 'lista' ? 'on' : ''}" onclick="vista.tab='lista';render()">🎟 Lista de ingreso</button><button class="tab ${tab === 'bdx' ? 'on' : ''}" onclick="vista.tab='bdx';render()">🧾 Bordereaux</button></div>` +
    (tab === 'bdx' ? bordereauxHTML(f, c) : listaHTML(f, c));
}

const TIPOS = [['General', 'General'], ['Solidaria', 'Solidaria'], ['Otro precio', 'Otro precio'], ['Invitado elenco', 'Invitado (elenco)'], ['2x1', '2x1 (sin cargo)'], ['Promoción', 'Promoción'], ['Otro invitado', 'Otro invitado']];
function listaHTML(f, c) {
  const rs = [...c.rs].sort((a, b) => (ingreso(a) ? 1 : 0) - (ingreso(b) ? 1 : 0) || num(b.ID) - num(a.ID));
  return `<div class="card" style="margin-bottom:1.2rem"><div class="inl" onkeydown="if(event.key==='Enter')agregarReserva()">
    <label class="f">Nombre<input id="r-n" data-focus></label><label class="f">Apellido<input id="r-a"></label>
    <label class="f" style="max-width:170px">Tipo<select id="r-t" onchange="reservaTipo()">${TIPOS.map(([v, l]) => `<option value="${v}">${l}</option>`).join('')}</select></label>
    <label class="f" style="max-width:80px;min-width:80px">Cant.<input id="r-c" type="number" value="1" min="1" oninput="reservaTipo()"></label>
    <label class="f" style="max-width:130px">Monto total<input id="r-m" type="number" value="${num(f['Precio general'])}"></label>
    <label class="f" style="max-width:190px">Pago<select id="r-p"><option value="">Paga en puerta</option><option>Efectivo</option><option>Transferencia</option><option>Mercado Pago</option></select></label>
    <button class="btn p" onclick="agregarReserva()">+ Agregar</button></div></div>
  <div class="card"><div class="list">${rs.length ? rs.map(r => {
    const inv = num(r.Monto) <= 0, ing = ingreso(r);
    return `<div class="item" style="${ing ? 'opacity:.7' : ''}"><div style="flex:1;min-width:160px"><div class="t">${esc(r.Nombre)} ${esc(r.Apellido)}${num(r.Cantidad) > 1 ? ` <span class="chip in">×${r.Cantidad}</span>` : ''}</div>
      <div class="d">${esc(r.Tipo)}${inv ? '' : ' · ' + m$(r.Monto)}${r.Medio && !ing ? ' · ya pagó (' + esc(r.Medio) + ')' : ''}</div></div>
      ${ing ? `<span class="chip ok">✓ Ingresó${r.Medio ? ' · ' + esc(r.Medio) : ''}</span><button class="btn s g" onclick="ingresar(${r.ID},false)">↩</button>`
        : (inv || r.Medio) ? `<button class="btn ok2" onclick="ingresar(${r.ID},true)">✅ Ingresó</button>`

const egCuenta = e => e.Estado !== 'Pendiente';
function ctaResumen() {
  const ing = ingresosAuto(), anios = [...new Set([hoy().slice(0, 4), ...ing.map(x => x.fecha.slice(0, 4)), ...T.Egresos.map(e => String(e.Fecha).slice(0, 4))])].filter(Boolean).sort().reverse();
  const filas = [];
  for (let m = 1; m <= 12; m++) {
    const k = `${ctaAnio}-${pad(m)}`, de = o => ing.filter(x => mesDe(x.fecha) === k && x.origen === o).reduce((s, x) => s + x.monto, 0);
    const t = de('Talleres'), te = de('Teatro'), al = de('Alquiler');
    const eg = T.Egresos.filter(e => mesDe(e.Fecha) === k && egCuenta(e)).reduce((s, e) => s + num(e.Monto), 0);
    const re = T.Retiros.filter(r => mesDe(r.Fecha) === k).reduce((s, r) => s + num(r.Monto), 0);
    filas.push({ m, t, te, al, ing: t + te + al, eg, res: t + te + al - eg, re });
  }
  const tot = filas.reduce((a, f) => { for (const k in f) if (k !== 'm') a[k] = (a[k] || 0) + f[k]; return a; }, {});
  const max = Math.max(1, ...filas.map(f => Math.max(f.ing, f.eg)));
  const fijos = T.Costos_Fijos.reduce((s, c) => s + num(c.Monto), 0), mesAct = hoy().slice(0, 7);

  return `<div class="sec" style="margin-top:0">PUNTO DE EQUILIBRIO · ${MESES[parseInt(mesAct.slice(5))].toUpperCase()}</div>

  <div class="bar" style="margin:1rem 0"><i style="width:${Math.min(100, cob)}%;background:${col}"></i></div>
  ${fijos === 0 ? '<div class="card mut">Cargá tus costos fijos en la solapa Ajustes para ver el equilibrio.</div>' : falta > 0 ? `<div class="card">Para llegar al equilibrio faltan <span class="chip br">${Math.ceil(falta / cfg('seguro'))}</span> funciones al mínimo del seguro de sala (${m$(cfg('seguro'))}) o <span class="chip br">${Math.ceil(falta / cfg('alquiler_sugerido'))}</span> alquileres de ${m$(cfg('alquiler_sugerido'))}.</div>` : '<div class="card ok">✅ Este mes ya cubrió los costos fijos.</div>'}
  <div class="sec">MES A MES <select onchange="ctaAnio=this.value;render()" style="background:var(--card);color:var(--txt);border:1px solid var(--line);border-radius:10px;padding:.4rem .8rem;font-size:1rem">${anios.map(a => `<option ${a === ctaAnio ? 'selected' : ''}>${a}</option>`).join('')}</select></div>
  <div class="tw"><table><thead><tr><th>Mes</th><th class="num">Talleres</th><th class="num">Teatro</th><th class="num">Alquileres</th><th class="num">Ingresos</th><th class="num">Egresos</th><th class="num">Resultado</th><th class="num">Retiros</th><th class="num">Queda</th></tr></thead><tbody>
  ${filas.map(f => `<tr><td><b>${MESES[f.m]}</b><div class="bar" style="height:5px;margin-top:5px;width:120px"><i style="width:${f.ing / max * 100}%;background:var(--ok)"></i></div><div class="bar" style="height:5px;margin-top:2px;width:120px"><i style="width:${f.eg / max * 100}%;background:var(--bad)"></i></div></td>
    <td class="num">${m$(f.t)}</td><td class="num">${m$(f.te)}</td><td class="num">${m$(f.al)}</td><td class="num ok">${m$(f.ing)}</td><td class="num bad">${m$(f.eg)}</td><td class="num ${rc(f.res)}"><b>${m$(f.res)}</b></td><td class="num">${m$(f.re)}</td><td class="num ${rc(f.res - f.re)}">${m$(f.res - f.re)}</td></tr>`).join('')}
  <tr style="font-weight:700"><td>TOTAL ${ctaAnio}</td><td class="num">${m$(tot.t)}</td><td class="num">${m$(tot.te)}</td><td class="num">${m$(tot.al)}</td><td class="num ok">${m$(tot.ing)}</td><td class="num bad">${m$(tot.eg)}</td><td class="num ${rc(tot.res)}">${m$(tot.res)}</td><td class="num">${m$(tot.re)}</td><td class="num ${rc(tot.res - tot.re)}">${m$(tot.res - tot.re)}</td></tr></tbody></table></div>
  <div class="mut" style="margin-top:.8rem;font-size:.85rem">Ingresos = lo que se queda Brava (lo del profe y el elenco no cuenta). Los retiros de socios no son gasto del espacio: se restan aparte.</div>`;
}

  form(e ? 'EDITAR EGRESO' : 'NUEVO EGRESO', [
    { id: 'c', label: 'Concepto', value: e ? e.Concepto : '', ph: 'Ej: Alquiler noviembre' },
    { id: 'm', label: 'Monto ($)', type: 'number', value: e ? e.Monto : '', half: true },
    { id: 'f', label: 'Fecha', type: 'date', value: e ? String(e.Fecha).slice(0, 10) : hoy(), half: true },
    { id: 'ca', label: 'Categoría', type: 'select', value: e ? e['Categoría'] : 'Otro', options: CATEGORIAS, half: true },
    { id: 'mo', label: 'Modalidad de pago', type: 'select', value: e ? e.Modalidad : 'Transferencia', options: ['Efectivo', 'Transferencia', 'Débito', 'Tarjeta'], half: true },
    { id: 'es', label: 'Estado', type: 'select', value: e ? e.Estado || 'Pagado' : 'Pagado', options: [['Pagado', 'Pagado'], ['Pendiente', 'Pendiente de pago']] },
    { id: 'n', label: 'Notas', value: e ? e.Notas : '', ph: 'Opcional' }
  ], v => {
    if (!v.c.trim() || !num(v.m)) { toast('Concepto y monto son obligatorios', true); return false; }
    const row = { Fecha: v.f, Concepto: v.c.trim(), Monto: num(v.m), Modalidad: v.mo, 'Categoría': v.ca, Estado: v.es, Notas: v.n };
    e ? upd('Egresos', e.ID, row) : add('Egresos', row);
    toast('Egreso guardado'); ctaMes = mesDe(v.f); render();
  }, e ? { borrar: () => { del('Egresos', e.ID); render(); } } : {});
}

function ctaPend() {
  const p = pendientesCalc();
  const bloque = (t, arr, tot, vacio) => `<div class="card"><div class="sec" style="margin-top:0">${t} <small>${m$(tot)}</small></div>${arr.length ? `<div class="list">${arr.map(x => `<div class="item"><div style="flex:1;min-width:150px" class="t">${esc(x.texto)}</div><b>${m$(x.monto)}</b><button class="btn s" onclick="go('${x.go[0]}',${typeof x.go[1] === 'number' ? x.go[1] : `'${x.go[1] || ''}'`}${x.go[0] === 'cuentas' ? ",'egresos'" : ''})">Ver</button></div>`).join('')}</div>` : `<div class="empty">${vacio}</div>`}</div>`;
  return `<div class="grid g2">${bloque('LE DEBEN A BRAVA', p.cobrar, p.totC, 'Nada por cobrar ✅')}${bloque('BRAVA TIENE QUE PAGAR', p.pagar, p.totP, 'Nada por pagar ✅')}</div>`;
}

function ctaRetiros() {
  const rs = [...T.Retiros].sort((a, b) => String(b.Fecha).localeCompare(String(a.Fecha)));
  const porSocio = {}; rs.forEach(r => porSocio[r.Socio] = (porSocio[r.Socio] || 0) + num(r.Monto));
  return `<div class="row" style="margin-bottom:1rem"><span class="sp"></span><button class="btn p" onclick="formRetiro()">+ Retiro</button></div>
  <div class="grid g3" style="margin-bottom:1rem">${stat('Total retirado', m$(rs.reduce((s, r) => s + num(r.Monto), 0)))}${Object.entries(porSocio).map(([s, v]) => stat(esc(s), m$(v))).join('')}</div>
  <div class="card"><div class="list">${rs.length ? rs.map(r => `<div class="item"><div style="flex:1"><div class="t">${esc(r.Socio)}</div><div class="d">${fFull(r.Fecha)} · ${esc(r.Modalidad)}${r.Notas ? ' · ' + esc(r.Notas) : ''}</div></div><b>${m$(r.Monto)}</b><button class="btn s g" onclick="formRetiro(${r.ID})">✏️</button></div>`).join('') : '<div class="empty">Todavía no hay retiros</div>'}</div></div>`;
}
function formRetiro(id) {
  const r = id ? T.Retiros.find(x => String(x.ID) === String(id)) : null;
  form(r ? 'EDITAR RETIRO' : 'NUEVO RETIRO', [
    { id: 's', label: 'Socio', type: 'select', value: r ? r.Socio : 'Anto', options: ['Anto', 'Eze', 'Otro'], half: true },
    { id: 'm', label: 'Monto ($)', type: 'number', value: r ? r.Monto : '', half: true },
    { id: 'f', label: 'Fecha', type: 'date', value: r ? String(r.Fecha).slice(0, 10) : hoy(), half: true },
    { id: 'mo', label: 'Modalidad', type: 'select', value: r ? r.Modalidad : 'Transferencia', options: ['Efectivo', 'Transferencia'], half: true },
    { id: 'n', label: 'Notas', value: r ? r.Notas : '' }
  ], v => {
    if (!num(v.m)) { toast('Falta el monto', true); return false; }
    const row = { Socio: v.s, Monto: num(v.m), Fecha: v.f, Modalidad: v.mo, Notas: v.n };
    r ? upd('Retiros', r.ID, row) : add('Retiros', row); toast('Retiro guardado'); render();
  }, r ? { borrar: () => { del('Retiros', r.ID); render(); } } : {});
}

const AJ = [['seguro', 'Seguro de sala por función ($)'], ['pct_sala', '% de sala sobre el neto'], ['equipamiento', 'Uso de equipamiento por función ($)'], ['puesta_luces', 'Puesta de luces, primera función ($)'],
  ['argentores', '% Argentores'], ['hora_ensayo', 'Hora de ensayo ($)'], ['capacidad', 'Capacidad de la sala'], ['precio_general', 'Entrada general ($)'], ['precio_solidaria', 'Entrada solidaria ($)'], ['alquiler_sugerido', 'Alquiler sugerido ($)'], ['pin', 'PIN de Cuentas']];
function ctaAjustes() {
  return `<div class="grid g2"><div class="card"><div class="sec" style="margin-top:0">VALORES DEL ESPACIO</div>
    ${AJ.map(([k, l]) => `<label class="f">${l}<input value="${esc(k === 'pin' ? cfg('pin') : cfg(k))}" ${k === 'pin' ? '' : 'inputmode="decimal"'} onchange="setCfg('${k}',this.value);toast('Guardado')"></label>`).join('')}</div>
    <div class="card"><div class="row"><div class="sec" style="margin:0">COSTOS FIJOS MENSUALES</div><span class="sp"></span><button class="btn p s" onclick="formCosto()">+ Costo</button></div>
    <div class="list" style="margin-top:.6rem">${T.Costos_Fijos.length ? T.Costos_Fijos.map(c => `<div class="item"><div class="t" style="flex:1">${esc(c.Concepto)}</div><b>${m$(c.Monto)}</b><button class="btn s g" onclick="formCosto(${c.ID})">✏️</button></div>`).join('') : '<div class="empty">Cargá alquiler, servicios, etc.</div>'}</div>
    <div class="row" style="margin-top:.8rem"><b>Total</b><span class="sp"></span><b>${m$(T.Costos_Fijos.reduce((s, c) => s + num(c.Monto), 0))}</b></div></div></div>`;
}
function formCosto(id) {
  const c = id ? T.Costos_Fijos.find(x => String(x.ID) === String(id)) : null;
  form(c ? 'EDITAR COSTO FIJO' : 'NUEVO COSTO FIJO', [
    { id: 'c', label: 'Concepto', value: c ? c.Concepto : '' }, { id: 'm', label: 'Monto mensual ($)', type: 'number', value: c ? c.Monto : '' }
  ], v => { if (!v.c.trim() || !num(v.m)) { toast('Completá los dos datos', true); return false; } const row = { Concepto: v.c.trim(), Monto: num(v.m) }; c ? upd('Costos_Fijos', c.ID, row) : add('Costos_Fijos', row); render(); },
  c ? { borrar: () => { del('Costos_Fijos', c.ID); render(); } } : {});
}

// ═══════════ ARRANQUE ═══════════
async function arrancar() {
  if (!APPS_URL) { render(); return; }
  try { const c = JSON.parse(localStorage.getItem('brava_cache') || 'null'); if (c) { aplicar(c); } } catch (e) {}
  render();
  try {
    const d = await (await fetch(APPS_URL)).json();
    if (d.error) throw new Error(d.error);
    if (pendientes === 0) { aplicar(d); guardarLocal(); }
  } catch (e) {
    toast('No se pudo conectar con Google. Revisá la URL o el despliegue.', true);
  }
  render();
}
setInterval(() => { if (pendientes === 0) guardarLocal(); }, 20000);
arrancar();
</script>
